name: Deploy to staging

on:
  push:
    branches: [ main ]

jobs:
  redeploy_everything:
    runs-on: ubuntu-latest
    name: Deploying everything to the staging cluster

    steps:
      - run: |
          echo "${{ secrets.SSH_PRIVATE_KEY }}" > ~/ssh_key

          mkdir -p ~/.ssh

          echo "${{ secrets.KNOWN_HOST }}" > ~/.ssh/known_hosts

          chmod 600 ~/ssh_key
          chmod 644 ~/.ssh/known_hosts

          ssh -i ~/ssh_key ubuntu@3.235.138.41 \
            "bash -lc 'source ~/.nvm/nvm.sh && cd ~/bms && git pull origin main && pnpm install && pnpm run build && pm2 restart fe-server && pm2 restart http-server && pm2 restart ws-server'"
